name: Chess++ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make

    - name: Build Project
      run: make

    - name: Build and Run Tests
      run: make run-tests

    - name: Clean up
      run: make clean